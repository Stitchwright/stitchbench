# Local Postgres for development: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: stitchbench
      POSTGRES_PASSWORD: stitchbench
      POSTGRES_DB: stitchbench
    ports:
      - "127.0.0.1:5433:5432" # this PC only: the dev password is in this file
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
