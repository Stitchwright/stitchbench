# Builds the desktop programs on GitHub's machines (Smart App Control on the shop PC blocks unsigned build tools):
#   Windows  "StitchBench Setup <version>.exe" and "StitchShop Setup <version>.exe"
#   macOS    .dmg and .zip, Apple silicon and Intel
#   Linux    .AppImage and .deb, x64 and arm64
# Run it from the Actions tab (Desktop installers -> Run workflow) or push a tag like v1.7.2. Download the installers
# from the run's page (kept for 7 days); a tag also publishes them on the repository's Releases page.
# Set the version in desktop/package.json first. Windows (Azure Artifact Signing) and macOS (Developer ID, notarized)
# are signed by jobs that use the "release" environment, which holds the secrets and allows only the release branch and
# v* tags (docs/CODE_SIGNING.md); a run from anywhere else, or without the secrets, builds unsigned with a warning.
# Linux is unsigned.
name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# The build runs every dependency's install scripts: it gets a read-only token, the checkout doesn't leave it in
# .git/config, and the actions are pinned to the commits their tags point at (update them on purpose, not by surprise).
permissions:
  contents: read

jobs:
  # Linux. Each runner builds for its own architecture (the program ships a native Postgres). No signing.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install the app's packages
        run: npm ci --no-audit --no-fund

      - name: Install the program's packages
        working-directory: desktop
        run: npm ci

      - name: Build the app for the program
        working-directory: desktop
        run: node prepare-app.mjs

      - name: StitchBench installer
        working-directory: desktop
        run: npm run installer:linux

      - name: StitchShop installer
        working-directory: desktop
        run: npm run installer:stitchshop:linux

      - name: Keep the installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.name }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist-stitchshop/*.AppImage
            desktop/dist-stitchshop/*.deb
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # macOS: signed with the Developer ID certificate and notarized by electron-builder (hardened runtime and the
  # entitlements are in desktop/package.json and desktop/build/entitlements.mac.plist). The "release" environment holds the
  # secrets and only the release branch and v* tags may use it; elsewhere, or with a secret missing, the build is
  # unsigned and says so.
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: mac-arm64 }
          - { os: macos-15-intel, name: mac-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    environment: ${{ (github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v')) && 'release' || '' }}
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # Only this step sees the secrets while the packages install, and it only asks whether they are there.
      - name: Check for the signing secrets
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=""
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -z "$missing" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=macOS build is UNSIGNED::Not signing or notarizing; missing secrets:$missing (the release environment applies only to the release branch and v* tags)."
          fi

      - name: Install the app's packages
        run: npm ci --no-audit --no-fund

      - name: Install the program's packages
        working-directory: desktop
        run: npm ci

      - name: Build the app for the program
        working-directory: desktop
        run: node prepare-app.mjs

      # electron-builder's own temporary keychain failed at "security set-key-partition-list" on the runner (run 14), so
      # the certificate is imported here into a keychain of ours, which electron-builder then only uses (CSC_KEYCHAIN).
      - name: Import the signing certificate
        id: keychain
        if: ${{ steps.signing.outputs.signed == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          p12="$RUNNER_TEMP/signing.p12"
          keychain="$HOME/Library/Keychains/build.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          # Ours first in the search list, the others kept.
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          echo "path=$keychain" >> "$GITHUB_OUTPUT"
          identities=$(security find-identity -v -p codesigning build.keychain)
          echo "$identities"
          case "$identities" in
            *"Developer ID Application: Bruce Wattendorf (JK9FZ6HPC6)"*) ;;
            *) echo "::error::The Developer ID Application identity for Bruce Wattendorf (JK9FZ6HPC6) is not in the imported certificate"; exit 1 ;;
          esac

      - name: StitchBench and StitchShop installers (signed and notarized)
        if: ${{ steps.signing.outputs.signed == 'true' }}
        working-directory: desktop
        env:
          CSC_KEYCHAIN: ${{ steps.keychain.outputs.path }}
          # electron-builder wants the name without the "Developer ID Application:" prefix (the import step checks the full one).
          CSC_NAME: "Bruce Wattendorf (JK9FZ6HPC6)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run installer:mac
          npm run installer:stitchshop:mac

      # If signing fails, say which file: electron-builder's own message stops at "codesign --verify ... failed". One full
      # verbose check of each app, then every Mach-O file in it on its own (a verify stops at the first bad file).
      - name: Why did signing fail
        if: ${{ failure() && steps.signing.outputs.signed == 'true' }}
        run: |
          for app in $(find desktop/dist desktop/dist-stitchshop -maxdepth 3 -name '*.app' -type d 2>/dev/null); do
            echo "::group::codesign --verify --deep --strict --verbose=4 $app"
            codesign --verify --deep --strict --verbose=4 "$app" 2>&1 || true
            echo "::endgroup::"
            echo "::group::Mach-O files in $app that do not verify"
            find "$app" -type f -print0 | while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q 'Mach-O'; then
                out=$(codesign --verify --strict --verbose=2 "$f" 2>&1) || echo "BAD $f: $out"
              fi
            done
            echo "::endgroup::"
            echo "::group::Symbolic links in $app that point outside it"
            find "$app" -type l | while IFS= read -r l; do
              t=$(readlink "$l"); case "$t" in /*) echo "ABSOLUTE $l -> $t" ;; esac
            done
            echo "::endgroup::"
          done

      - name: StitchBench and StitchShop installers (unsigned)
        if: ${{ steps.signing.outputs.signed != 'true' }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run installer:mac -- -c.mac.identity=null -c.mac.notarize=false
          npm run installer:stitchshop:mac -- -c.mac.identity=null -c.mac.notarize=false

      # Show what a shop will meet: the signature, the notarization ticket and Gatekeeper's verdict.
      - name: Check the signatures
        if: ${{ steps.signing.outputs.signed == 'true' }}
        run: |
          set -e
          for dmg in desktop/dist/*.dmg desktop/dist-stitchshop/*.dmg; do
            dir=$(mktemp -d)
            hdiutil attach "$dmg" -mountpoint "$dir" -nobrowse -quiet
            app=$(ls -d "$dir"/*.app | head -1)
            echo "== $dmg"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|flags|Timestamp'
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
            hdiutil detach "$dir" -quiet
          done

      - name: Keep the installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist-stitchshop/*.dmg
            desktop/dist-stitchshop/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Delete the keychain
        if: ${{ always() && steps.signing.outputs.signed == 'true' }}
        run: |
          security delete-keychain build.keychain || true
          rm -f "$RUNNER_TEMP/signing.p12"

  # Windows, part 1: build the two programs unpacked (no installer yet) so the "sign" job can sign StitchBench.exe and
  # StitchShop.exe before they are packed. This job runs every dependency's install scripts and has no secrets.
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Not used while building, but Prisma's config reads it.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # @emnapi/core and @emnapi/runtime are listed as optional dependencies so every platform's npm keeps them in the
      # lock file (Tailwind's and sharp's WebAssembly builds need them); the checks workflow runs npm ci on Linux too.
      - name: Install the app's packages
        run: npm ci --no-audit --no-fund

      - name: Install the program's packages
        working-directory: desktop
        run: npm ci

      - name: Build the app for the program
        working-directory: desktop
        run: node prepare-app.mjs

      - name: Unpacked StitchBench and StitchShop
        working-directory: desktop
        run: |
          npm run unpacked
          npm run unpacked:stitchshop

      - name: Keep the unpacked programs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-unpacked
          path: |
            desktop/dist/win-unpacked
            desktop/dist-stitchshop/win-unpacked
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  # Windows, part 2: Azure Artifact Signing (docs/CODE_SIGNING.md). Signs the two programs, packs them into the NSIS
  # installers with electron-builder (--prepackaged), then signs the installers. The "release" environment holds the
  # secrets; elsewhere, or with a secret missing, the installers are built unsigned and it says so. The secrets reach
  # only the checking step and the signing steps, never the package install. The files inside the programs that
  # are not StitchBench.exe / StitchShop.exe (the embedded Postgres, DLLs) are not signed.
  sign:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ${{ (github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v')) && 'release' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install the program's packages
        working-directory: desktop
        run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: win-unpacked
          path: desktop

      - name: Check for the signing secrets
        id: signing
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          $missing = @('AZURE_TENANT_ID','AZURE_CLIENT_ID','AZURE_CLIENT_SECRET','AZURE_SIGNING_ENDPOINT','AZURE_SIGNING_ACCOUNT','AZURE_CERT_PROFILE') | Where-Object { -not (Get-Item "env:$_" -ErrorAction SilentlyContinue).Value }
          if ($missing.Count -eq 0) { "signed=true" >> $env:GITHUB_OUTPUT }
          else {
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning title=Windows installers are UNSIGNED::Not signing; missing secrets: $($missing -join ', ') (the release environment applies only to the release branch and v* tags)."
          }

      # Inputs per https://github.com/Azure/artifact-signing-action (action.yml at v2.0.0).
      - name: Sign StitchBench.exe and StitchShop.exe
        if: ${{ steps.signing.outputs.signed == 'true' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files: |
            ${{ github.workspace }}\desktop\dist\win-unpacked\StitchBench.exe
            ${{ github.workspace }}\desktop\dist-stitchshop\win-unpacked\StitchShop.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pack the installers
        working-directory: desktop
        run: |
          npm run installer:prepackaged
          npm run installer:stitchshop:prepackaged

      # The folders are not searched recursively, so only the installers beside win-unpacked are signed.
      - name: Sign the StitchBench installer
        if: ${{ steps.signing.outputs.signed == 'true' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\desktop\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign the StitchShop installer
        if: ${{ steps.signing.outputs.signed == 'true' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\desktop\dist-stitchshop
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signatures
        if: ${{ steps.signing.outputs.signed == 'true' }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem desktop/dist/*.exe, desktop/dist-stitchshop/*.exe) + @(Get-Item desktop/dist/win-unpacked/StitchBench.exe, desktop/dist-stitchshop/win-unpacked/StitchShop.exe)
          if ($files.Count -ne 4) { throw "Expected 4 files (2 installers, 2 programs), found $($files.Count)" }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status), $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed: $($sig.Status)" }
            if ($null -eq $sig.TimeStamperCertificate) { throw "$($f.Name) has no timestamp" }
          }

      - name: Keep the installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers
          path: |
            desktop/dist/*.exe
            desktop/dist-stitchshop/*.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # A tag (v1.7.2) publishes every installer on the Releases page. Skipped for a manual run.
  # Only this job can write to the repository; it never runs the build.
  release:
    needs: [sign, mac, linux]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Windows: "installers". macOS and Linux: one "installers-<name>" each. "win-unpacked" (the signing job's input)
      # is left out on purpose.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installers
          path: files
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-{mac,linux}-*
          path: files
          merge-multiple: true

      - name: Gather the files
        run: find files -mindepth 2 -type f -exec mv -t files {} + && find files -mindepth 1 -type d -empty -delete

      - name: Checksums
        working-directory: files
        run: find . -type f ! -name SHA256SUMS.txt -printf '%P\n' | sort | xargs sha256sum > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt .

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag files/* \
            || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber files/*
